services:
  - type: web
    name: edens-purr-online-arena
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER_MODE
        value: disabled
      - key: STREAMLABS_TIP_URL
        value: https://streamlabs.com/kiraplays_yt/tip
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
